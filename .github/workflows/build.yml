name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Locate Android SDK
        run: |
          SDK=""
          for d in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk; do
            if [ -n "$d" ] && [ -d "$d/platforms" ]; then SDK="$d"; break; fi
          done
          if [ -z "$SDK" ]; then
            echo "no preinstalled sdk, installing minimal set"
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk=$SDK"
          ls "$SDK" || true
      - name: Install required packages
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SM="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            SM="$(command -v sdkmanager || true)"
          fi
          echo "sdkmanager=$SM"
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: holo-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore